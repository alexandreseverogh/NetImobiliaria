name: 🚀 Deploy Manual

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch para fazer deploy'
        required: true
        default: 'main'
        type: string
      ambiente:
        description: 'Ambiente de destino'
        required: true
        default: 'producao'
        type: choice
        options:
          - producao
          - staging

jobs:
  deploy:
    name: Deploy → ${{ github.event.inputs.ambiente }} (${{ github.event.inputs.branch }})
    runs-on: ubuntu-latest

    steps:
      - name: 📋 Informações do Deploy
        run: |
          echo "============================================"
          echo "🌿 Branch:     ${{ github.event.inputs.branch }}"
          echo "🎯 Ambiente:   ${{ github.event.inputs.ambiente }}"
          echo "👤 Solicitado: ${{ github.actor }}"
          echo "🕐 Horário:    $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"

      - name: 🛡️ Validar Regras de Branch
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          AMBIENTE="${{ github.event.inputs.ambiente }}"

          if [ "$AMBIENTE" == "producao" ] && [ "$BRANCH" != "main" ]; then
            echo "============================================"
            echo "❌ DEPLOY BLOQUEADO!"
            echo ""
            echo "   Apenas a branch 'main' pode ser deployada em produção."
            echo "   Fluxo correto:"
            echo "   1. Deploy '$BRANCH' → staging"
            echo "   2. Testar em staging"
            echo "   3. Abrir PR: $BRANCH → main"
            echo "   4. Aprovar e mergear"
            echo "   5. Deploy 'main' → producao"
            echo "============================================"
            exit 1
          fi

          echo "✅ Validação OK: '$BRANCH' → '$AMBIENTE'"

      - name: 🔐 Deploy via SSH na VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          # ── LLM ──────────────────────────────────────────
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # ── WhatsApp (Evolution API) ──────────────────────
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
          # ── Notificações ──────────────────────────────────
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # ── Google Calendar (OAuth Client + Service Account) ──
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          # ── SMTP (e-mail de confirmação de agendamento) ───
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          # ── Stripe (cobrança dos módulos billáveis) ───────
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          envs: ANTHROPIC_API_KEY,GEMINI_API_KEY,EVOLUTION_API_URL,EVOLUTION_API_KEY,EVOLUTION_INSTANCE,SLACK_WEBHOOK_URL,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_SERVICE_ACCOUNT_KEY,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASS,SMTP_FROM_NAME,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET
          script: |
            set -e
            BRANCH="${{ github.event.inputs.branch }}"
            AMBIENTE="${{ github.event.inputs.ambiente }}"
            REPO_RAW="https://raw.githubusercontent.com/alexandreseverogh/NetImobiliaria/$BRANCH"

            echo "🔄 Atualizando scripts de infraestrutura..."
            mkdir -p ~/net-imobiliaria/scripts/vps
            curl -fsSL "$REPO_RAW/Dockerfile.prod"                       -o ~/net-imobiliaria/Dockerfile.prod
            curl -fsSL "$REPO_RAW/Dockerfile.feed"                       -o ~/net-imobiliaria/Dockerfile.feed
            curl -fsSL "$REPO_RAW/docker-compose.vps.yml"                -o ~/net-imobiliaria/docker-compose.vps.yml
            curl -fsSL "$REPO_RAW/scripts/vps/deploy-github.sh"          -o ~/net-imobiliaria/scripts/vps/deploy-github.sh
            curl -fsSL "$REPO_RAW/scripts/vps/apply-migrations.sh"       -o ~/net-imobiliaria/scripts/vps/apply-migrations.sh
            chmod +x ~/net-imobiliaria/scripts/vps/deploy-github.sh
            chmod +x ~/net-imobiliaria/scripts/vps/apply-migrations.sh
            echo "   ✅ Scripts atualizados!"

            echo "🚀 Iniciando deploy — Branch: $BRANCH | Ambiente: $AMBIENTE"
            cd ~/net-imobiliaria
            ./scripts/vps/deploy-github.sh "$BRANCH" "$AMBIENTE"

      - name: ✅ Deploy Concluído
        run: |
          echo "============================================"
          echo "✅ Deploy concluído com sucesso!"
          echo "   Branch:   ${{ github.event.inputs.branch }}"
          echo "   Ambiente: ${{ github.event.inputs.ambiente }}"
          echo "============================================"
