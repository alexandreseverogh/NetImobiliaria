services:
  # Cache Redis (compartilhado por todos os serviços)
  redis:
    image: redis:7-alpine
    container_name: netimobiliaria-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis_local_pass}
    ports:
      - "${REDIS_PORT_HOST:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_local_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    # Dica: se o seu banco pré-docker é Postgres 17 (ex.: dump gerado em 17.x),
    # use POSTGRES_IMAGE=postgres:17-alpine no seu .env / ambiente.
    # Padronizado: Postgres 17 (mesma versão do schema/backups atuais)
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: netimobiliaria-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-net_imobiliaria}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # Porta do Postgres no HOST (Windows). Use uma porta dedicada para evitar
      # conflito/confusão com Postgres local instalado no Windows.
      # Dentro do compose continua 5432 (app/feed usam DB_HOST=db).
      - "${DB_PORT_HOST:-15432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Backups/dumps disponíveis para restore manual (não executa automaticamente)
      - ./database/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-net_imobiliaria}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netimobiliaria-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # DB dentro do compose: host = nome do serviço
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-net_imobiliaria}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

      # Ajuste recomendado (evita loop de login entre máquinas/containers)
      JWT_SECRET: "CHANGE_ME_IN_PROD"

      # Next
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Healthcheck
      HEALTHCHECK_DB: "true"
      # Redis (Cache + Rate Limiting)
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local_pass}
      # Object Storage (Local S3)
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_default_pass}
      S3_BUCKET: ${S3_BUCKET_LOCAL:-net-imobiliaria}
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      CDN_URL: http://localhost:9000/net-imobiliaria
      # Windows/Docker: garantir hot-reload detectando mudanças no bind-mount
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "1000"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3002:3000"
    # Dev-friendly: hot reload
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0", "-p", "3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  # Tradutor gratuito e sem limites (self-hosted)
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: netimobiliaria-translator
    restart: unless-stopped
    environment:
      - LT_LOAD_ONLY=en,pt
    # porta 5000 interna
    expose:
      - "5000"

  # Worker do FEED (scheduler + processamento) dentro do Docker
  # Isso garante que os conteúdos do schema "feed" sejam coletados e gravados
  # no MESMO Postgres do container (db), evitando divergência entre máquinas.
  feed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netimobiliaria-feed
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      libretranslate:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-net_imobiliaria}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Usar tradutor local (sem limites)
      LIBRETRANSLATE_URL: "http://libretranslate:5000"
      # Usado apenas se cair no fallback HTTP (idealmente não precisa)
      NEXT_PUBLIC_API_URL: "http://app:3000"
      # Windows/Docker: garante que scripts/watchers (se existirem) detectem mudanças
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
    command: ["node", "scripts/feed-cron-scheduler.js"]

  # Worker de SLA do Lead Router (expiração + transbordo)
  lead-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netimobiliaria-lead-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-net_imobiliaria}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # URL base para montar o link do painel no e-mail
      NEXT_PUBLIC_APP_URL: "http://localhost:3002"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
    command: ["node", "scripts/lead-router-sla-worker.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Object Storage Local (MinIO) - Para testes rigorosos de S3
  minio:
    image: minio/minio:latest
    container_name: netimobiliaria-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_default_pass}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  redis_data:
  minio_data:



